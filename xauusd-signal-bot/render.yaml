services:
  - type: web
    name: xauusd-signal-bot
    runtime: python
    plan: free
    rootDir: xauusd-signal-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
